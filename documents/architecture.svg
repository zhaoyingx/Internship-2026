<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="'PingFang SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="540" fill="#ffffff"/>

  <!-- ===== Frontend ===== -->
  <rect x="40" y="25" width="840" height="100" rx="10" fill="#eaf2ff" stroke="#4a79c7" stroke-width="1.5"/>
  <text x="58" y="48" font-size="15" font-weight="700" fill="#2a4d8f">前端 Frontend (Vue + Element Plus)</text>

  <rect x="120" y="60" width="160" height="48" rx="8" fill="#ffffff" stroke="#9db8e0"/>
  <text x="200" y="89" font-size="14" text-anchor="middle" fill="#333">对话区</text>
  <rect x="380" y="60" width="160" height="48" rx="8" fill="#ffffff" stroke="#9db8e0"/>
  <text x="460" y="89" font-size="14" text-anchor="middle" fill="#333">历史会话</text>
  <rect x="640" y="60" width="160" height="48" rx="8" fill="#ffffff" stroke="#9db8e0"/>
  <text x="720" y="89" font-size="14" text-anchor="middle" fill="#333">文件上传</text>

  <!-- Front -> Back -->
  <line x1="460" y1="125" x2="460" y2="168" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="475" y="152" font-size="12" fill="#666">HTTP  /api/...　（前后端分离：只通过接口通信）</text>

  <!-- ===== Backend ===== -->
  <rect x="40" y="172" width="840" height="252" rx="10" fill="#eef6ee" stroke="#4a8a54" stroke-width="1.5"/>
  <text x="58" y="195" font-size="15" font-weight="700" fill="#2d6135">后端 Backend (Go + chi)</text>

  <!-- Handler -->
  <rect x="70" y="205" width="780" height="50" rx="8" fill="#ffffff" stroke="#aaa"/>
  <text x="85" y="226" font-size="13" font-weight="700" fill="#222">Handler 层 — 解析请求 / 返回 JSON</text>
  <text x="85" y="244" font-size="11.5" fill="#666">提供服务：① 问答对话　② 会话历史(增删查)　③ 资料上传</text>

  <line x1="460" y1="255" x2="460" y2="273" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Service -->
  <rect x="70" y="275" width="780" height="46" rx="8" fill="#ffffff" stroke="#aaa"/>
  <text x="85" y="303" font-size="13" font-weight="700" fill="#222">Service 层 — 业务逻辑 / 组装数据 / 调模型 / 调向量库</text>

  <!-- Service -> 3 columns -->
  <line x1="175" y1="321" x2="175" y2="349" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="321" x2="460" y2="349" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="745" y1="321" x2="745" y2="349" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3 columns -->
  <rect x="75" y="351" width="200" height="58" rx="8" fill="#fafafa" stroke="#aaa"/>
  <text x="175" y="376" font-size="13" font-weight="700" text-anchor="middle" fill="#222">Manager 层</text>
  <text x="175" y="395" font-size="11.5" text-anchor="middle" fill="#666">(数据库读写)</text>

  <rect x="360" y="351" width="200" height="58" rx="8" fill="#fafafa" stroke="#aaa"/>
  <text x="460" y="376" font-size="13" font-weight="700" text-anchor="middle" fill="#222">Model Client</text>
  <text x="460" y="395" font-size="11.5" text-anchor="middle" fill="#666">(调本地模型)</text>

  <rect x="645" y="351" width="200" height="58" rx="8" fill="#fafafa" stroke="#aaa"/>
  <text x="745" y="376" font-size="13" font-weight="700" text-anchor="middle" fill="#222">Vector Client</text>
  <text x="745" y="395" font-size="11.5" text-anchor="middle" fill="#666">(向量检索)</text>

  <!-- columns -> stores -->
  <line x1="175" y1="409" x2="175" y2="452" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="409" x2="460" y2="452" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="745" y1="409" x2="745" y2="452" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== External stores ===== -->
  <rect x="95" y="454" width="160" height="60" rx="8" fill="#fdf3e6" stroke="#c0903f"/>
  <text x="175" y="479" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5a1e">SQLite</text>
  <text x="175" y="498" font-size="11.5" text-anchor="middle" fill="#8a6a2e">会话 / 记录</text>

  <rect x="380" y="454" width="160" height="60" rx="8" fill="#fdf3e6" stroke="#c0903f"/>
  <text x="460" y="479" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5a1e">Ollama</text>
  <text x="460" y="498" font-size="11.5" text-anchor="middle" fill="#8a6a2e">本地模型</text>

  <rect x="665" y="454" width="160" height="60" rx="8" fill="#fdf3e6" stroke="#c0903f"/>
  <text x="745" y="479" font-size="13" font-weight="700" text-anchor="middle" fill="#7a5a1e">chromem-go</text>
  <text x="745" y="498" font-size="11.5" text-anchor="middle" fill="#8a6a2e">向量库</text>
</svg>
